spring.application.name=trip-pilot-backend
server.port=8080

# H2 Database configuration with PostgreSQL compatibility mode
spring.datasource.url=jdbc:h2:mem:trippilotdb;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Seed via Spring DataInitializer component after schema creation
spring.sql.init.mode=never

# Logging
logging.level.com.trippilot=INFO
